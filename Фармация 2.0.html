*{box-sizing:border-box}

nav button.on{background:linear-gradient(135deg,#5f8dff,#9b5de5);border-color:transparent;color:#fff}
.card{background:rgba(255,255,255,.9);border:2px solid #fff;border-radius:24px;padding:13px 14px;margin-bottom:13px;box-shadow:0 8px 20px rgba(100,80,200,.16)}
.card h3{margin:0;font-size:16px}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 8px}
.big{font-size:18px;font-weight:700;margin:4px 0}
.ru{color:var(--mut);font-size:13.5px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc{border:2px solid var(--line);background:var(--sel);color:var(--ink);border-radius:16px;min-height:78px;padding:8px;font-size:14px;cursor:pointer;font-family:inherit}
.fc i{display:block;font-style:normal;font-size:22px}
.fc .bk{display:none;font-weight:700}.fc.on .bk{display:block}.fc.on .f{display:none}
.fc.on{background:var(--ok);border-color:var(--okb)}
.fc small{display:block;color:var(--pk2);font-weight:400;margin-top:2px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mt>div{display:flex;flex-direction:column;gap:6px}
.pill,.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:9px 8px;font-size:14px;font-family:inherit;cursor:pointer;text-align:center}
.pill.sel{background:var(--sel);border-color:var(--pk)}
.pill.ok,.opt.ok{background:var(--ok);border-color:var(--okb)}
.pill.bad,.opt.bad{background:var(--bad);border-color:var(--badb)}
.pill:disabled{opacity:.75}
.opts{display:grid;gap:7px;margin-top:6px}
input{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px;font-size:16px;background:var(--card);color:var(--ink);margin:6px 0}
.btn{border:0;background:linear-gradient(135deg,#6a8dff,#9b5de5);color:#fff;border-radius:14px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;margin-right:6px}
.btn.g{background:var(--sel);color:var(--ink)}
.msg{min-height:20px;margin-top:6px;font-size:13.5px;font-weight:600}
.end{font-size:17px;font-weight:700;margin:6px 0 10px}
.txt p{margin:0 0 9px}.txt .en{font-size:15.5px;margin:0}.txt mark{background:var(--sel);color:var(--pk2);border-radius:6px;padding:0 3px;font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:700;font-size:14px}
.hp{flex:1;height:12px;background:var(--line);border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:var(--badb);transition:width .4s}
u{text-decoration:none;border-bottom:3px solid var(--pk);padding:0 4px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mc{min-height:66px;border:2px solid var(--line);background:var(--sel);border-radius:14px;font-size:12px;font-family:inherit;color:var(--ink);padding:4px;cursor:pointer}.mc.up{background:var(--card);border-color:var(--pk)}.mc.ok{background:var(--ok);border-color:var(--okb)}
.panel{display:none}.panel.on{display:block}

function review(){const a=S.flatMap(s=>s.w),p=document.createElement('div');
 p.innerHTML='<section class=card><h3>🔁 Повторяем все выражения</h3><div class=sub>Всё из учебника вперемешку</div></section>';

function memory(s){const[d,b]=box('🧠 Мемори','Найди пары: слово и перевод');const q=sh(s.w);let pos=0;
 const r=()=>{const W=[0,1,2,3,4,5].map(j=>q[(pos+j)%q.length]);pos+=6;
  const C=sh(W.flatMap(w=>[[w,0],[w,1]]));let open=[],left=6,mv=0;
  b.innerHTML='<div class=mem></div><div class=msg></div>';const g=$('.mem',b),m=$('.msg',b);
  C.forEach(([w,t])=>{const k=document.createElement('button');k.className='mc';k.textContent='❓';
   k.onclick=()=>{if(open.length>1||k.classList.contains('up'))return;k.classList.add('up');k.textContent=t?w[1]:w[2]+' '+w[0];open.push([k,w]);
    if(open.length==2){mv++;const[[a,x],[c,y]]=open;
     if(x===y){a.classList.add('ok');c.classList.add('ok');open=[];if(!--left){m.innerHTML='🎉 Ходов: '+mv+' <button class=btn>Дальше</button>';$('.btn',m).onclick=r}}
     else setTimeout(()=>{[a,c].forEach(z=>{z.classList.remove('up');z.textContent='❓'});open=[]},900)}};g.append(k)})};r();return d}
function listen(s){const[d,b]=box('🎧 Слушай и выбери','Нажми «Послушать» и выбери перевод');
 const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
 quiz(b,sh(s.w).map(w=>{const x=wq(w,s.w,1);x.q=`<button class=btn data-s="${w[0]}">🔊 Послушать</button><div class=sub>Что ты услышал?</div>`;return x}));
 b.addEventListener('click',e=>{const k=e.target.closest('[data-s]');if(k)say(k.dataset.s)});return d}
const cat=e=>/^to /.test(e)?3:/hour|stomach|meals|a day|twice/.test(e)?2:/pharmac|chemist|department|^prescription$/.test(e)?1:0;
function sort(s){const[d,b]=box('🧺 Разложи по корзинам','Куда относится слово?');const G=['💊 Лекарства и действие','🏥 Места, люди, рецепт','⏰ Когда и сколько','🎬 Что делать'];
 const q=sh(s.w);let pos=0;
 const r=()=>{const W=Array.from({length:Math.min(8,q.length)},(_,j)=>q[(pos+j)%q.length]);pos+=8;let i=0,ok=0;
  const n=()=>{if(i>=W.length){b.innerHTML=`<div class=end>${ok}/${W.length} ${ok==W.length?'🎉':'💪'}</div><button class=btn>Дальше</button>`;$('.btn',b).onclick=r;return}
   const w=W[i];b.innerHTML=`<div class=sub>${i+1}/${W.length}</div><div class=big>${w[2]} ${w[0]}</div><div class=ru>${w[1]}</div><div class=opts style="grid-template-columns:1fr 1fr">${G.map((g,j)=>`<button class=opt data-j=${j}>${g}</button>`).join('')}</div>`;
   b.querySelectorAll('.opt').forEach(k=>k.onclick=()=>{const c=cat(w[0]),g=+k.dataset.j===c;
    b.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===c)x.classList.add('ok')});if(!g)k.classList.add('bad');else ok++;
    setTimeout(()=>{i++;n()},g?600:1300)})};n()};r();return d}
function scr(s){const[d,b]=box('🔤 Буквы-перемешки','Собери слово из букв');const P=sh(s.w.filter(w=>!/[ ,-]/.test(w[0])));let i=0;
 const r=()=>{const w=P[i++%P.length],a=w[0];let k=0;
  b.innerHTML=`<div class=ru>${w[2]} ${w[1]}</div><div class=big style="letter-spacing:3px;min-height:28px"></div><div class=opts style="display:flex;flex-wrap:wrap">${sh([...a]).map(x=>`<button class=opt style="min-width:40px">${x}</button>`).join('')}</div>`;
  const o=$('.big',b);b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(x.textContent===a[k]){o.textContent+=x.textContent;x.disabled=true;x.classList.add('ok');if(++k==a.length){o.style.color='var(--okb)';setTimeout(r,1200)}}else{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400)}})};r();return d}
function blitz(s){const[d,b]=box('⚡ Блиц 30 секунд','Подходит ли перевод? Отвечай быстро!');
 const go=()=>{let t=30,sc=0,bad=0,g;const nx=()=>{const w=s.w[Math.random()*s.w.length|0];g=Math.random()<.5;const x=g?w:sh(s.w.filter(y=>y!==w))[0];$('.q',b).innerHTML=`<div class=big>${w[2]} ${w[0]}</div><div class=ru>${x[1]}</div>`};
  b.innerHTML='<div class=bar><span class=tm>⏱ 30</span><span class=sc>⭐ 0</span></div><div class=q></div><div class=opts style="grid-template-columns:1fr 1fr"><button class="opt y">✅ Верно</button><button class="opt n">❌ Неверно</button></div>';nx();
  const iv=setInterval(()=>{if(!b.isConnected){clearInterval(iv);return}t--;$('.tm',b).textContent='⏱ '+t;
   if(t<=0){clearInterval(iv);b.innerHTML=`<div class=end>⭐ Верно: ${sc}, ошибок: ${bad}</div><button class=btn>Ещё раз</button>`;$('.btn',b).onclick=go}},1000);
  const ans=v=>{if(v===g)sc++;else bad++;$('.sc',b).textContent='⭐ '+sc;nx()};$('.y',b).onclick=()=>ans(true);$('.n',b).onclick=()=>ans(false)};go();return d}
